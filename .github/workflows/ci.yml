name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test the application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests and package the application
        run: mvn --batch-mode --no-transfer-progress verify

  container:
    name: Verify the container image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the image without publishing it
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: cicd-learning-app:ci
